name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python-lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Tesseract
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr
      - name: Install CPU-only Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Ruff lint
        run: |
          pip install ruff
          ruff check common backend/app data_pipeline benchmarks --exit-zero
      - name: Run validator + split-leakage + metrics + API contract tests
        run: pytest common/tests data_pipeline/tests benchmarks/tests backend/tests -v

  rails-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gate-visits-admin
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
          working-directory: gate-visits-admin
      - name: Run Rails test suite
        run: bin/rails test

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  cpu-smoke-eval:
    runs-on: ubuntu-latest
    needs: python-lint-and-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Tesseract
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr
      - name: Install CPU-only Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Generate a small synthetic sample and run the pipeline on it
        run: |
          python data_pipeline/synthetic/generate_synthetic.py --count 5
          python benchmarks/smoke_eval.py
